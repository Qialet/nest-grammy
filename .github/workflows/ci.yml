name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: Test (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [10, 11, 12]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Nest ${{ matrix.nest }}
        if: matrix.nest != 12
        run: >
          pnpm --filter nest-grammy add -D
          @nestjs/common@^${{ matrix.nest }}
          @nestjs/core@^${{ matrix.nest }}
          @nestjs/testing@^${{ matrix.nest }}
          @nestjs/platform-express@^${{ matrix.nest }}
      - run: pnpm test
      - run: pnpm build
